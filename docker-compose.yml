services:
  chronoframe:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronoframe-fivk-custom:v1.2.0
    container_name: chronoframe
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
